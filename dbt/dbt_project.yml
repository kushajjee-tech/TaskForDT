name: finance_onboarding
version: "1.0.0"
profile: finance_onboarding

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  finance_onboarding:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  finance_onboarding:
    +schema: reference
    entities:
      +column_types: {entity_id: varchar, entity_name: varchar, country: varchar, functional_currency: varchar}
    fx_rates:
      +column_types: {period: date, currency: varchar, usd_per_unit: double, rate_type: varchar}
    standard_coa:
      +column_types: {standard_category: varchar, pnl_group: varchar, category_sign: integer, is_intercompany: boolean, description: varchar}
    intercompany_transactions:
      +column_types: {ic_id: varchar, period: date, provider_entity: varchar, recipient_entity: varchar, fee_usd: double, description: varchar}
    coa_mapping:
      +column_types: {entity_id: varchar, account_id: varchar, account_name: varchar, standard_category: varchar, confidence: double, method: varchar, status: varchar, reason: varchar}
