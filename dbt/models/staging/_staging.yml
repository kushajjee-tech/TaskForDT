version: 2

models:
  - name: stg_qbo__accounts
    description: Cleaned chart of accounts, one row per entity and account.
    columns:
      - name: entity_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('entities'), field: entity_id}}
      - name: account_id
        data_tests: [not_null]
      - name: classification
        data_tests:
          - accepted_values:
              arguments:
                values: ['Asset', 'Liability', 'Equity', 'Revenue', 'Expense']
  - name: stg_qbo__pnl_monthly
    description: One row per entity, account and month with a non-zero P&L amount (local currency).
    columns:
      - name: period
        data_tests: [not_null]
      - name: amount_local
        data_tests: [not_null]
