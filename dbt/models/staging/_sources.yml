version: 2

sources:
  - name: raw
    schema: raw
    description: Raw data landed by the extractor, exactly as QuickBooks returned it (flattened).
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: qbo_accounts
        description: Chart of accounts per entity (incremental on LastUpdatedTime, includes inactive accounts).
      - name: qbo_pnl_monthly
        description: Profit and loss amounts per account per month, from the ProfitAndLoss report.
      - name: qbo_pnl_net_income
        description: QuickBooks' own Net Income per month. Used only to reconcile our model.
      - name: qbo_pnl_period_totals
        description: Per-account totals for the whole synced range from a separate report call. Used only to reconcile.
      - name: sync_runs
        description: One row per stream per sync run (status, rows, window, error).
        config:
          freshness: null
